<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Brooki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; } </style>
</head>
<body>

    <nav class="bg-white shadow-sm py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="fw-bold text-danger mb-0">🛡️ Brooki Admin</h4>
            <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold small">← Volver al Muro</a>
        </div>
    </nav>

    <main class="container">
        <div class="row mb-5">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 bg-primary text-white h-100">
                    <h5 class="fw-bold">Usuarios Totales</h5>
                    <h2 class="fw-bold mb-0" id="statUsuarios">--</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 h-100" style="background-color: #6c63ff; color: white;">
                    <h5 class="fw-bold">Publicaciones (Muro)</h5>
                    <h2 class="fw-bold mb-0" id="statPublicaciones">--</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 text-center p-4 bg-danger text-white h-100">
                    <h5 class="fw-bold">Reportes Activos</h5>
                    <h2 class="fw-bold mb-0" id="statReportes">--</h2>
                </div>
            </div>
        </div>

        <ul class="nav nav-pills mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold rounded-pill px-4 me-2" data-bs-toggle="pill" data-bs-target="#tabUsuarios" type="button">Usuarios Registrados</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold rounded-pill px-4 me-2" data-bs-toggle="pill" data-bs-target="#tabPublicaciones" type="button">Muro Público</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tabReportes" type="button">🚨 Reportes</button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 rounded-4 shadow-sm" id="adminTabsContent">
            
            <div class="tab-pane fade show active" id="tabUsuarios" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios"><tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="tabPublicaciones" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Autor (ID)</th>
                                <th>Título</th>
                                <th>Fecha</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPublicaciones"><tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="tabReportes" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID Reporte</th>
                                <th>ID Elemento</th>
                                <th>Motivo</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReportes">
                            <tr><td colspan="5" class="text-center text-muted">Cargando reportes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </main>

    <div class="modal fade" id="modalResponderReporte" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">📩 Responder Reporte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="reporteIdActual">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small">Respuesta para el usuario (Respuesta_Admin)</label>
                        <textarea id="respuestaAdminTexto" class="form-control rounded-4 px-3" rows="4" placeholder="Ej: La publicación fue revisada y eliminada por violar nuestras normas comunitarias..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-3 shadow-sm fw-bold" id="btnSoloResponder" onclick="procesarReporte('responder')">✉️ Enviar Respuesta</button>
                    <button type="button" class="btn btn-success rounded-pill px-3 shadow-sm fw-bold" id="btnResolver" onclick="procesarReporte('resolver')">✔ Resolver</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
