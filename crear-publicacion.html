<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Publicación | Brooki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/crear-publicacion.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="create-page">

    <nav class="brooki-navbar">
        <div class="container nav-content">

            <a class="brand-wall" href="index.html">
                <span class="brand-icon-small">☺</span>
                Brooki
            </a>

            <div class="nav-actions">
                <a href="index.html" class="btn-back">
                    ← Volver al Muro
                </a>

                <button class="btn-logout" id="btnCerrarSesion">
                    Cerrar Sesión
                </button>
            </div>

        </div>
    </nav>

    <main class="create-wrapper">

        <section class="create-card">

            <div class="create-header">
                <span class="create-icon">＋</span>
                <p>Nueva publicación</p>
                <h1>Comparte algo con Brooki</h1>
                <span>
                    Publica productos, anuncios o información útil para tu comunidad.
                </span>
            </div>

            <form id="formCrearPublicacion" class="create-form">

                <div class="form-group">
                    <label for="inputTitulo">Título</label>
                    <input
                        type="text"
                        id="inputTitulo"
                        placeholder="¿Qué quieres anunciar?"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="inputContenido">Contenido</label>
                    <textarea
                        id="inputContenido"
                        rows="4"
                        placeholder="Describe los detalles..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="selectProducto">Producto a anunciar</label>
                    <select id="selectProducto" required>
                        <option value="" disabled selected>Cargando productos...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputImagen">Imagen de la publicación</label>
                    <input
                        type="file"
                        id="inputImagen"
                        accept="image/*"
                    >
                </div>

                <button type="submit" class="btn-publish" id="btnPublicar">
                    Publicar en el Muro →
                </button>

            </form>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/crear.js"></script>

</body>

</html>
