<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Publicación | Brooki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/crear-publicacion.css?v=2">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="create-page">

    <nav class="brooki-navbar">
        <div class="container nav-content">

            <a class="brand-wall" href="index.html" aria-label="Brooki" style="display:inline-flex;align-items:center;text-decoration:none;">
                <span class="brooki-logo-wordmark" style="display:inline-flex;flex-direction:row;align-items:center;white-space:nowrap;font-weight:800;font-size:28px;letter-spacing:-0.03em;line-height:1;color:#6940C3;">
                    <span style="color:#6940C3;">Br</span>
                    <svg class="brooki-oo-smile" width="32" height="22" style="width:32px;height:22px;margin:3px 1px 0 1px;flex-shrink:0;display:inline-block;" viewBox="0 0 36 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="18" cy="11.7" r="6.2" fill="#E9E0FF"/>
                        <path d="M4.5 10.5 Q8 5.5 11.5 10.5" stroke="#6940C3" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                        <path d="M24.5 10.5 Q28 5.5 31.5 10.5" stroke="#6940C3" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                        <path d="M6.5 14.2 Q18 23.2 29.5 14.2" stroke="#6940C3" stroke-width="3" stroke-linecap="round" fill="none"/>
                    </svg>
                    <span style="color:#6940C3;">ki</span>
                </span>
            </a>

            <div class="nav-actions">
                <a href="index.html" class="btn-back">
                    ← Volver al Muro
                </a>

                <button class="btn-logout" id="btnCerrarSesion">
                    Cerrar Sesión
                </button>
            </div>

        </div>
    </nav>

    <main class="create-wrapper">

        <section class="create-card">

            <div class="create-header">
                <span class="create-icon">＋</span>
                <p>Nueva publicación</p>
                <h1>Comparte algo con Brooki</h1>
                <span>
                    Publica productos, anuncios o información útil para tu comunidad.
                </span>
            </div>

            <form id="formCrearPublicacion" class="create-form">

                <div class="form-group">
                    <label for="inputTitulo">Título</label>
                    <input
                        type="text"
                        id="inputTitulo"
                        placeholder="¿Qué quieres anunciar?"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="inputContenido">Contenido</label>
                    <textarea
                        id="inputContenido"
                        rows="4"
                        placeholder="Describe los detalles..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="selectProducto">Producto a anunciar</label>
                    <select id="selectProducto" required>
                        <option value="" disabled selected>Cargando productos...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputImagen">Imagen de la publicación</label>
                    <input
                        type="file"
                        id="inputImagen"
                        accept="image/*"
                    >
                </div>

                <button type="submit" class="btn-publish" id="btnPublicar">
                    Publicar en el Muro →
                </button>

            </form>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/crear.js"></script>

</body>

</html>
