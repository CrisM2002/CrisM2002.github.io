<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro Principal | Brooki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="page-wall">

    <nav class="brooki-navbar">
        <div class="container nav-content">

            <a class="brand-wall" href="index.html">
                <span class="brand-icon-small">☺</span>
                Brooki
            </a>

           <div class="nav-actions">
    
                <a href="admin.html" id="btnNavAdmin" class="btn btn-danger fw-bold rounded-pill border px-3 d-none" style="margin-right: 10px;">
                    🛡️ Panel Admin
                </a>
                
                <a href="productos.html" id="btnNavProductos" class="btn btn-warning fw-bold rounded-pill border px-3 d-none" style="color: #333; margin-right: 10px;">
                    🏪 Mi Tienda
                </a>

                <a href="perfil.html" class="btn btn-light fw-bold rounded-pill border px-3" style="color: #6c63ff;">
                    👤 Mi Perfil
                </a>
                
                <a href="crear-publicacion.html" class="btn-new-post">
                    + Nueva Publicación
                </a>
                <button class="btn-logout" id="btnCerrarSesion">
                    Cerrar Sesión
                </button>
            </div>

        </div>
    </nav>

    <main class="wall-wrapper">

       <section class="wall-header">
            <p class="welcome-text">Tu espacio para compartir, descubrir y conectar</p>
            <h1>Últimas Publicaciones</h1>

            <div class="search-box mt-4 mb-4" style="max-width: 600px; margin: 0 auto;">
                <div class="input-group input-group-lg shadow-sm" style="border-radius: 20px; overflow: hidden; border: 2px solid #e2e8f0; transition: 0.3s;">
                    <span class="input-group-text bg-white border-0 text-muted px-4" style="font-size: 1.2rem;">🔍</span>
                    <input type="text" id="inputBuscador" class="form-control border-0 bg-white" placeholder="Buscar por título, contenido o autor..." style="box-shadow: none; font-family: var(--fuente);">
                </div>
            </div>
        </section>

        <section class="feed-container">

            <div id="contenedorPublicaciones">
                <div class="loading-box">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p>Cargando publicaciones...</p>
                </div>
            </div>

        </section>

    </main>

    <div class="modal fade" id="modalVisorImagen" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0 p-0 text-end d-block">
                    <button type="button" class="btn-close btn-close-white mb-2" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="imagenAmpliacion" src="" class="img-fluid rounded shadow-lg" style="max-height: 85vh;">
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarPublicacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">Editar Publicación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editIdPublicacion">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted" style="font-size: 14px;">Título</label>
                        <input type="text" id="editTitulo" class="form-control rounded-4 p-3" style="border: 2px solid #e2e8f0; font-family: var(--fuente);">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted" style="font-size: 14px;">Contenido</label>
                        <textarea id="editContenido" class="form-control rounded-4 p-3" rows="4" style="border: 2px solid #e2e8f0; resize: none; font-family: var(--fuente);"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" id="btnGuardarEdicion" onclick="guardarEdicion()" style="background: linear-gradient(135deg, #5b8def, #7b61ff); border: none;">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

<div class="modal fade" id="modalReportarPublicacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-danger">🚩 Reportar Contenido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Ayúdanos a mantener Brooki seguro. Dinos por qué estás reportando esto.</p>
                    
                    <input type="hidden" id="reportIdReferencia">
                    <input type="hidden" id="reportTipoReferencia">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted" style="font-size: 14px;">Motivo del reporte</label>
                        <textarea id="reportMotivo" class="form-control rounded-4 p-3" rows="3" placeholder="Ej: Contenido ofensivo, spam, fraude..." style="border: 2px solid #e2e8f0; resize: none;"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted" style="font-size: 14px;">Evidencia (Opcional)</label>
                        <input type="file" id="reportImagen" class="form-control rounded-4" accept="image/*" style="border: 2px solid #e2e8f0;">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 shadow-sm fw-bold" id="btnEnviarReporte" onclick="enviarReporte()">Enviar Reporte</button>
                </div>
            </div>
        </div>
    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/muro.js"></script>

</body>

</html>
