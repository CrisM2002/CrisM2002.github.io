<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Brooki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/index.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-wall">

    <nav class="brooki-navbar">
        <div class="container nav-content">
            <a class="brand-wall" href="index.html" aria-label="Brooki" style="display:inline-flex;align-items:center;text-decoration:none;">
                <span class="brooki-logo-wordmark" style="display:inline-flex;flex-direction:row;align-items:center;white-space:nowrap;font-weight:800;font-size:28px;letter-spacing:-0.03em;line-height:1;color:#6940C3;">
                    <span style="color:#6940C3;">Br</span>
                    <svg class="brooki-oo-smile" width="32" height="22" style="width:32px;height:22px;margin:3px 1px 0 1px;flex-shrink:0;display:inline-block;" viewBox="0 0 36 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="18" cy="11.7" r="6.2" fill="#E9E0FF"/>
                        <path d="M4.5 10.5 Q8 5.5 11.5 10.5" stroke="#6940C3" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                        <path d="M24.5 10.5 Q28 5.5 31.5 10.5" stroke="#6940C3" stroke-width="2.8" stroke-linecap="round" fill="none"/>
                        <path d="M6.5 14.2 Q18 23.2 29.5 14.2" stroke="#6940C3" stroke-width="3" stroke-linecap="round" fill="none"/>
                    </svg>
                    <span style="color:#6940C3;">ki</span>
                </span>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn-back">← Volver al Muro</a>
                <button class="btn-logout" id="btnCerrarSesionPerfil">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="wall-wrapper">
        <div class="card border-0 shadow-sm mb-5" style="border-radius: 24px; background: white;">
            <div class="card-body text-center p-5">
                <div id="avatarPerfil" class="mx-auto mb-3 bg-primary text-white d-flex justify-content-center align-items-center rounded-circle shadow" style="width: 100px; height: 100px; font-size: 2.5rem; font-weight: bold; background: linear-gradient(135deg, #5b8def, #7b61ff) !important;">
                    U
                </div>
                <h2 id="nombrePerfil" class="fw-bold text-dark mb-1">Cargando...</h2>
                <p id="correoPerfil" class="text-muted mb-2">cargando@correo.com</p>
                <span id="rolPerfil" class="badge bg-light text-primary border border-primary px-3 py-2 rounded-pill" style="font-size: 0.9rem;">Cargando...</span>
                
                <div class="mt-4">
                    <button class="btn btn-outline-primary rounded-pill px-4 fw-bold shadow-sm" onclick="abrirModalEditarPerfil()">✏️ Editar Perfil</button>
                </div>
        </div>

        <h4 class="fw-bold mb-4 text-dark text-center">Tus Publicaciones</h4>
        
        <div id="contenedorMisPublicaciones">
            <div class="text-center w-100"><div class="spinner-border text-primary" role="status"></div></div>
        </div>
    </main>

    <div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">✏️ Editar Mi Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Nombre de Usuario</label>
                        <input type="text" id="editNombrePerfil" class="form-control rounded-4 p-3" placeholder="Tu nombre de usuario" style="border: 2px solid #e2e8f0;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Nombre Completo</label>
                        <input type="text" id="editNombreCompletoPerfil" class="form-control rounded-4 p-3" placeholder="Tu nombre completo" style="border: 2px solid #e2e8f0;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Nueva Contraseña (Déjalo en blanco si no quieres cambiarla)</label>
                        <input type="password" id="editContrasenaPerfil" class="form-control rounded-4 p-3" placeholder="********" style="border: 2px solid #e2e8f0;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small">Foto de Perfil (Opcional)</label>
                        <input type="file" id="editFotoPerfil" class="form-control rounded-4" accept="image/*" style="border: 2px solid #e2e8f0;">
                    </div>

                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" id="btnGuardarPerfil" onclick="guardarCambiosPerfil()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/perfil.js"></script>

</body>
</html>
