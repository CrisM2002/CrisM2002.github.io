<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Productos | Brooki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: 'Poppins', sans-serif;">

    <nav class="brooki-navbar bg-white shadow-sm py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brand-wall text-decoration-none fw-bold text-dark fs-4" href="index.html">
                <span class="text-primary me-1">☺</span>Brooki Tienda
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4 me-2 fw-bold small">← Volver al Muro</a>
                <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" id="btnNuevoProducto">+ Nuevo Producto</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-0">Gestión de Productos</h2>
                <p class="text-muted mb-0">Administra tu catálogo de ventas</p>
            </div>
            <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm" id="badgeRol">Verificando...</span>
        </div>

        <div class="row" id="contenedorProductos">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Cargando inventario...</p>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">📦 Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Nombre del Producto</label>
                            <input type="text" id="prodNombre" class="form-control rounded-pill px-3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Descripción</label>
                            <textarea id="prodDesc" class="form-control rounded-4 px-3" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small">Precio ($)</label>
                                <input type="number" step="0.01" id="prodPrecio" class="form-control rounded-pill px-3" required>
                            </div>
                            <div class="col-6 mb-3 d-flex align-items-end pb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="prodDisponible" checked>
                                    <label class="form-check-label text-muted small">Disponible</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" id="btnGuardarProd" onclick="guardarProducto()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
